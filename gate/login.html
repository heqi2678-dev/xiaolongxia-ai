<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小龙虾 · 请进店</title>
<style>
  :root { --bg:#1a1c2e; --card:#23263f; --accent:#ff5a3c; --text:#eef0ff; --muted:#8a90b0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, #2b2f55 0%, var(--bg) 60%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); padding:20px;
  }
  .card {
    width:100%; max-width:360px; background:var(--card);
    border:1px solid rgba(255,255,255,.06); border-radius:18px;
    padding:34px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .logo { text-align:center; font-size:46px; line-height:1; }
  .title { text-align:center; font-size:20px; font-weight:700; letter-spacing:2px; margin-top:8px; }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin:8px 0 26px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
  .field input {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.1);
    background:#1a1c2e; color:var(--text); font-size:15px; outline:none;
  }
  .field input:focus { border-color:var(--accent); }
  .btn {
    width:100%; padding:13px; margin-top:8px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:2px;
  }
  .btn:disabled { opacity:.6; cursor:default; }
  .msg { text-align:center; color:#ff7a5c; font-size:13px; min-height:18px; margin-top:14px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
  .switch { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .switch a { color:#ffb4a6; text-decoration:none; margin-left:6px; }
  .reg-only { display:none; }
  body.mode-reg .reg-only { display:block; }
  body.mode-reg .login-only { display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">小龙虾</div>
    <div class="title" id="t">请输入账号</div>
    <div class="sub" id="s">已有账号就登录。新人用邀请码自己开号。</div>
    <form id="f" autocomplete="off">
      <div class="field">
        <label for="u">账号</label>
        <input id="u" name="username" type="text" placeholder="账号" required autofocus>
      </div>
      <div class="field">
        <label for="p">口令</label>
        <input id="p" name="password" type="password" placeholder="进店口令" required>
      </div>
      <div class="field reg-only">
        <label for="p2">再输一遍口令</label>
        <input id="p2" name="password2" type="password" placeholder="再输一遍">
      </div>
      <div class="field reg-only">
        <label for="inv">邀请码</label>
        <input id="inv" name="invite" type="text" placeholder="主人发给你的邀请码" autocomplete="off">
      </div>
      <button class="btn" id="b" type="submit">进 店</button>
    </form>
    <div class="msg" id="m"></div>
    <div class="switch login-only">还没有账号？<a href="#" id="toReg">去注册</a></div>
    <div class="switch reg-only">已有账号？<a href="#" id="toLogin">去登录</a></div>
    <div class="foot">铜龙 · 小龙虾门店</div>
  </div>
<script>
const f = document.getElementById("f");
const b = document.getElementById("b");
const m = document.getElementById("m");
const t = document.getElementById("t");
const s = document.getElementById("s");
let mode = "login";
function setMode(next) {
  mode = next;
  document.body.className = next === "reg" ? "mode-reg" : "";
  t.textContent = next === "reg" ? "自己开号" : "请输入账号";
  s.textContent = next === "reg" ? "填账号、口令、邀请码。每人一间房。" : "已有账号就登录。新人用邀请码自己开号。";
  b.textContent = next === "reg" ? "注 册" : "进 店";
  document.getElementById("p2").required = next === "reg";
  document.getElementById("inv").required = next === "reg";
  m.textContent = "";
}
document.getElementById("toReg").addEventListener("click", (e) => { e.preventDefault(); setMode("reg"); });
document.getElementById("toLogin").addEventListener("click", (e) => { e.preventDefault(); setMode("login"); });
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  m.textContent = "";
  b.disabled = true;
  const username = document.getElementById("u").value.trim();
  const password = document.getElementById("p").value;
  try {
    if (mode === "reg") {
      const password2 = document.getElementById("p2").value;
      if (password !== password2) {
        m.textContent = "两次口令不一致";
        b.disabled = false;
        return;
      }
      const res = await fetch("/dian/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          username,
          password,
          password2,
          invite: document.getElementById("inv").value.trim()
        })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        location.replace("/dian/");
        return;
      }
      m.textContent = data.error || "注册失败";
    } else {
      const res = await fetch("/dian/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        location.replace("/dian/");
        return;
      }
      m.textContent = data.error || "账号或口令不对";
    }
  } catch (err) {
    m.textContent = "网络断了，请再试一次";
  }
  b.disabled = false;
});
</script>
</body>
</html>
